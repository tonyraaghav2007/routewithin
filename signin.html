<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B6F47">

  <title>Sign In — RouteWithin</title>
  <meta name="description" content="Sign in to your RouteWithin portal.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css?v=20261019b">
</head>

<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Sticky Navbar -->
  <nav class="navbar" id="mainNavbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="RouteWithin Homepage">
        <img src="assets/rw_logo.png" alt="RouteWithin - Life & Relationship Coach" class="brand-logo-img">
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="programs.html" class="nav-link">Programs</a></li>
        <li><a href="how-it-works.html" class="nav-link">How It Works</a></li>
        <li><a href="testimonials.html" class="nav-link">Testimonials</a></li>
        <li><a href="blog.html" class="nav-link">Blog</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a href="contact.html" class="btn btn-hero-book btn-sm">Book a Session</a>
      </div>
    </div>
  </nav>

  <main
    style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3.75rem 1.25rem; background: var(--bg-base);">
    <div
      style="background: var(--bg-card); border-radius: 1.5rem; padding: 2.75rem 2.25rem; max-width: 27.5rem; width: 100%; border: 0.0625rem solid rgba(139, 111, 71, 0.2); box-shadow: var(--shadow-md);">
      <h1
        style="font-family: var(--font-heading); font-size: 2.2rem; color: var(--text-heading); margin-bottom: 0.5rem; text-align: center;">
        Welcome Back</h1>
      <p style="font-size: 0.95rem; color: var(--text-secondary); text-align: center; margin-bottom: 1.75rem;">Sign in
        to access your RouteWithin coaching portal.</p>

      <form
        onsubmit="event.preventDefault(); showToast('Welcome back! Redirecting to client dashboard...'); setTimeout(() => window.location.href='index.html', 1500);">
        <div style="margin-bottom: 1.125rem;">
          <label
            style="display: block; font-size: 0.88rem; font-weight: 600; color: var(--text-heading); margin-bottom: 0.375rem;">Email
            Address</label>
          <input type="email" required placeholder="name@example.com"
            style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 0.0625rem solid rgba(139, 111, 71, 0.25); background: var(--bg-base); font-size: 0.95rem; outline: none; font-family: var(--font-body); color: var(--text-main);">
        </div>
        <div style="margin-bottom: 1.5rem;">
          <label
            style="display: block; font-size: 0.88rem; font-weight: 600; color: var(--text-heading); margin-bottom: 0.375rem;">Password</label>
          <input type="password" required placeholder="••••••••"
            style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 0.0625rem solid rgba(139, 111, 71, 0.25); background: var(--bg-base); font-size: 0.95rem; outline: none; font-family: var(--font-body); color: var(--text-main);">
        </div>
        <button type="submit" class="btn btn-hero-book btn-lg" style="width: 100%;">Sign In</button>
      </form>
    </div>
  </main>

  <!-- Global Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom-bar" style="border: none; padding: 0;">
        <div>© 2026 RouteWithin. All rights reserved.</div>
        <div style="display: flex; gap: 1rem;">
          <a href="index.html">Home</a>
          <span>|</span>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <div class="toast-notice" id="toastNotice"></div>
  <script src="app.js"></script>
</body>

</html>
